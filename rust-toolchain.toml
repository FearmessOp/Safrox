# Pinned so that every machine and CI run builds the kernel with the same
# compiler. `build-std` is a nightly-only feature, hence nightly.
[toolchain]
channel = "nightly"
# rust-src: required by -Z build-std, which compiles core/compiler_builtins
#           for x86_64-unknown-none from source.
# llvm-tools: provides llvm-objcopy/llvm-objdump for inspecting the kernel.
components = ["rust-src", "llvm-tools"]
targets = ["x86_64-unknown-none"]
profile = "minimal"