[build]
target = "x86_64-unknown-none"

[unstable]
# core and compiler_builtins must be rebuilt from source: the bare-metal
# target ships no precompiled std. `alloc` is deliberately absent -- the
# kernel performs no allocation before M4.
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]

# The following are already set by the x86_64-unknown-none target spec and
# are therefore NOT repeated here:
#   code-model=kernel          top 2 GiB (Intel SDM Vol. 1, 3.3.7.1)
#   disable-redzone            interrupts clobber it (AMD64 ABI 3.2.2)
#   -mmx,-sse,...,+soft-float  no SIMD state is saved this early
#   panic-strategy=abort
# Verify with:
#   rustc -Z unstable-options --target x86_64-unknown-none --print target-spec-json
[target.x86_64-unknown-none]
rustflags = [
    # Our linker script places the kernel at -2 GiB and KEEPs the Limine
    # request sections. Without it the image links at address 0 and never
    # boots.
    "-C", "link-arg=-Tkernel/linker.ld",

    # The target defaults to static-PIE. The kernel is loaded at a fixed
    # virtual address by the bootloader and performs no self-relocation, so
    # position independence must be switched off.
    "-C", "relocation-model=static",

    # The linker script discards .note.*, so the linker would otherwise warn
    # about dropping the build-id note it was about to emit.
    "-C", "link-arg=--build-id=none",

    # Limine maps each PT_LOAD segment independently at 4 KiB granularity.
    "-C", "link-arg=-zmax-page-size=0x1000",
    "-C", "link-arg=-znoexecstack",

]

# Path remapping is configured as `trim-paths` in Cargo.toml's profiles:
# `panic!()` embeds `file!()`, so an un-remapped build would print the
# builder's home directory in the panic output and the acceptance test would
# be asserting on it. scripts/check_kernel.py fails the build if an absolute
# path survives into the image.

# WARNING LEVELS ARE NOT SET HERE.
#
# Cargo does not merge rustflags across sources: an environment RUSTFLAGS
# *replaces* the list above wholesale. If the deny-warnings setting lived
# here, a developer running `RUSTFLAGS=... cargo build` would silently lose
# the linker script and get a kernel linked at address 0 that fails to boot.
#
# Warnings are denied in Cargo.toml's `[lints]` table instead, which composes
# correctly and needs no environment variable at all.